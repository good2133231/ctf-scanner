name: Smoke Nightly

# 续371：夜间全量 —— 与 smoke.yml 同一条命令（不带任何切片），每天跑一次。
# 为什么单独一个文件：`smoke.yml` 仍是**权威判定**（每次推送都跑全量），
# 这里只是给「白天用 fast 档、夜间补全量」留一个固定入口；
# 两者用不同的 concurrency group，互不取消。
on:
  schedule:
    # UTC 19:00 = 北京时间次日 03:00（GitHub Actions 的 cron 一律按 UTC）
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.lock

      - name: Run full smoke test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 tests/smoke.py 2>&1 | tee smoke-nightly.log

      - name: Upload night log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nightly-log
          path: smoke-nightly.log
          if-no-files-found: ignore
