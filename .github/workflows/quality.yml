# 质量门禁（与 smoke.yml 并排跑，不替换它）
#
# 为什么要有这个文件：`smoke.yml` 只跑一条 `python3 tests/smoke.py`（15 分钟超时），
# 而本项目的门禁口径一直是"**smoke + check_contrast +（相关时）run_devflow / browser_e2e**"
# —— 后三条以前只存在于"我记得跑一下"，机器上没人替我记得。
#
# 分工：
# - `smoke.yml`（既有）＝**权威判定**，口径仍是 Python 3.9 全量；
# - 本文件的 `contrast`＝秒级快查（改颜色/改模板就会红，没必要等十分钟）；
# - `devflow`＝13 阶段功能向量自检（每阶段真跑或如实 SKIP）；
# - `e2e`＝真浏览器（headless Chrome + CDP）跑页面交互，含"点了按钮 DOM 真的变"；
# - `probe-3.14`＝**必过门禁**（续260 升格）：换个新解释器跑全量，专治 `(?i)` 位置、`sre_parse`
#   搬家这类"在 CI 口径的 3.9 上永远看不见"的版本漂移。续259 修完红点链后它在真 runner 上
#   连绿满 3 次（3a42a45 / d9e4bfd / 9cc6930），按续254/续125 口径摘掉 `continue-on-error`
#   升为必过 —— 红了就挡合并；降级回去只允许出现在"连续 3 次全红且定位为新解释器上游问题"。
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 与 smoke.yml 同一口径（理由写在那边）：`group` 带上 workflow 名，两条门禁互不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast:
    name: 配色对比度（WCAG AA）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run contrast check
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 tools/check_contrast.py

  devflow:
    name: 阶段自检（13 阶段功能向量）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"          # 续140 提速：四个装依赖的步骤每次都重装同一份 20 个包的闭包。`cache: pip` 缺省只
          # glob `**/requirements*.txt`，看不见 requirements.lock ⇒ 下面那行是必需的，不是装饰（忘了它就是静默不缓存）。
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.lock   # 锁定的版本闭包（续137 生成）
      - name: Run devflow self-check
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 cli/run_devflow.py

  e2e:
    name: 真浏览器端到端（headless Chrome + CDP）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"          # 续140 提速：四个装依赖的步骤每次都重装同一份 20 个包的闭包。`cache: pip` 缺省只
          # glob `**/requirements*.txt`，看不见 requirements.lock ⇒ 下面那行是必需的，不是装饰（忘了它就是静默不缓存）。
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.lock   # 锁定的版本闭包（续137 生成）
      - name: Locate Chrome
        run: |
          set -e
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null; then echo "找到 $c -> $(command -v $c)"; exit 0; fi
          done
          echo "::error::runner 上没有 Chrome/Chromium —— e2e 会红不是代码红，先修环境"
          exit 1
      - name: Run browser end-to-end
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 tests/browser_e2e.py

  probe-3-14:
    name: 门禁 · Python 3.14 全量 smoke（必过，续260 升格）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          # 探针也要缓存（理由同上面那三处：`cache: pip` 看不见 .lock，必须指名依赖文件）
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.lock   # 锁定的版本闭包（续137 生成）
      - name: Run smoke test on a newer interpreter
        env:
          PYTHONUNBUFFERED: "1"
        # 续259：同 smoke.yml —— tee 日志 + 失败时上传 artifact（探针长期全红，日志此前不可见）。
        run: |
          set -o pipefail
          python3 tests/smoke.py 2>&1 | tee smoke314.log

      - name: Upload probe log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe314-log
          path: smoke314.log
          if-no-files-found: ignore
