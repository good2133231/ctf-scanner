# CTFScanner —— 指向 docker_todo/ 的薄包装，真正的定义在 docker_todo/docker-compose.yml
#
# 打包这条路**还没完善**，现状与缺口见 docker_todo/README.md。
# 本文件唯一的作用是让 `docker compose up -d --build` 这类既有用法与文档继续有效。
#
# ⚠ 不要把本文件与 docker_todo/docker-compose.dev.yml 拼在一起用：
#   相对路径按"第一个 compose 文件的目录"算项目根，那样会把挂载源解析成**仓库的上一级目录**。
#   开发形态请两个文件一起给：
#   docker compose -f docker_todo/docker-compose.yml -f docker_todo/docker-compose.dev.yml up -d

include:
  - docker_todo/docker-compose.yml
