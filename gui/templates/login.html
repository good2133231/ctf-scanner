<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 - CTFScanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<div class="login-box">
  <h1>CTF<span>Scanner</span></h1>
  <p class="muted">仅用于授权测试与 CTF 场景</p>
  <form method="post">
    <input type="text" name="username" placeholder="用户名" autocomplete="username" autofocus>
    <input type="password" name="password" placeholder="口令" autocomplete="current-password">
    {% if not bootstrap %}
    {# 续78 登录验证码：仅**账号登录**需要（引导口令分支不用，见 gui/app.py::login） #}
    <div class="captcha-row">
      <input type="text" name="captcha" placeholder="验证码" autocomplete="off" spellcheck="false">
      <img src="{{ url_for('captcha_png') }}" alt="验证码" title="看不清？点一下换一张"
           onclick="this.src='{{ url_for('captcha_png') }}?t='+Date.now()">
    </div>
    {% endif %}
    <button type="submit">登录</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
  {% if bootstrap %}
  <p class="muted" style="margin-top:14px;font-size:12px;line-height:1.6">
    当前<b>还没有任何账号</b>：可把 <code>config/settings.yaml</code> 里的
    <code>gui.token</code> 直接填进上面的「口令」登录（管理员身份），
    然后到「账号管理」页创建账号 —— <b>建好第一个账号后该口令立即失效</b>。
  </p>
  {% endif %}
</div>
</body>
</html>
