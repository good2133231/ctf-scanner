{% if auto_probe_summary %}
<p class="muted small note"><b>本任务自动送探记录（{{ auto_probe_summary|length }} 个子任务）</b>：
  {% for p in auto_probe_summary %}
  <a href="{{ url_for('task_detail', task_id=p.task_id) }}">#{{ p.task_id }}</a><span class="tech-tag"
     title="来源行：{{ p.domains|join('、') }}">{{ p.name or ('任务 #' ~ p.task_id) }}（{{ p.status or '未跑' }}）</span>
  {% endfor %}
  <br>这段记录直接读送探流水，<b>不受下面「只看不重叠 / 只看已解析」过滤影响</b>；展开过滤后，来源行本身也会显示「已自动送探 → #N」。
</p>
{% endif %}
