id: exposure-phpinfo
info:
  name: "phpinfo 页面暴露"
  author: ctfscanner
  severity: medium
  tags: [exposure, php, owasp-a05]
  description: "phpinfo 页面对外可访问，泄露服务器路径、环境变量、扩展版本等信息。"
http:
  - method: GET
    path: "/phpinfo.php"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["phpinfo()"]
        condition: or
  - method: GET
    path: "/info.php"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["phpinfo()"]
        condition: or
