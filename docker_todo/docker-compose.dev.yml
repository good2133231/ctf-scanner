# 开发 / 调参用覆盖文件：把**源码目录直接挂进容器**，改完代码不用重新 build 镜像。
#
#   docker compose -f docker_todo/docker-compose.yml -f docker_todo/docker-compose.dev.yml up -d
#   # 改完代码后：
#   docker compose -f docker_todo/docker-compose.yml -f docker_todo/docker-compose.dev.yml restart
#
# 与默认 compose 的区别只有一处：`..:/app` 把宿主机源码盖在镜像里的那份之上。
# 它**已经包含** ./config ./data ./logs（都在 `.` 下面），所以不需要再单独列。
#
# ⚠️ 这只适合**开发**：镜像里的代码被宿主机的覆盖了，等于镜像自带的版本没被用上。
# 交付 / 上服务器请用默认的 docker_todo/docker-compose.yml（那是"镜像即产物"，行为可复现）。

services:
  ctfscanner:
    volumes:
      - ..:/app
