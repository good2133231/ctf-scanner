gui:
  host: 127.0.0.1
  port: 5000
  token: ctfscanner
limits:
  max_workers: 20
  http_timeout: 10
  verify_tls: false
  # 第三方接口（FOFA/Shodan/Quake/crt.sh/KEV/iprecon/api.github.com）的证书校验，**默认开**。
  # 与上面那项分开：verify_tls 只为**目标侧**自签名靶场降级；第三方是公网 CA 签名、还带
  # API key / PAT，跟着降级等于把凭据交给中间人。企业 MITM 代理下 certifi 认不出根证书时
  # 才需要关掉它（属显式降级）。
  verify_tls_external: true
  dirscan_max_urls: 20
  vulnscan_max_urls: 100
  brute_max_domains: 50
  wildcard_filter: true
  favicon_md5: true
  # 统一并发/限速/全局预算门控（F2）。默认路径永不触发拒绝：256 恰等于现有单任务最大并发，
  # 单任务行为不变，只把跨任务的 N×2048 夹到 256。rate/budget 默认 0 = 不启用（opt-in）。
  max_inflight_global: 256       # 进程级在飞上限（跨任务共享）；0=不限
  max_inflight_per_task: 256     # 单任务在飞上限；0=不限
  rate_per_sec: 0                # 令牌桶速率（次/秒）；0=不限速
  rate_burst: 0                  # 令牌桶突发容量；0 → 取 max(rate_per_sec, 1)
  budget_total: 0                # 单任务请求总预算（HTTP/裸 socket/子进程共用）；0=不设预算
  budget_subprocess_weight: 1    # 每次外部工具调用消耗的预算单位
checks:
  min_severity: medium
  skip_severities:
  - info
  - low
  poc_engine: true
  disabled_categories: []
  disabled_checks: []
  poc_link_tags: true
  poc_max_per_site: 80
subdomain:
  # 子域名资产的 IP/CNAME 回填与 CDN 标记（纯 DNS 只读查询，不发 HTTP）
  max_resolve: 500
  dns_timeout: 3
  # subfinder(-all) 与内置免 key 被动源取并集，做到"尽量全"
  union_passive: true
passive:
  enabled: true
  sources: []
  timeout: 20
evasion:
  random_ua: true
  spoof_xff: false
  waf_bypass: true
  bypass_level: 2
  waf_detect: true
takeover:
  enabled: true
  max_hosts: 300
  http_check: true
portscan:
  enabled: false
  max_hosts: 100
  ports: ''
  mode: top
  full_ports: 1-65535
  exclude_scanned: true
  full_workers: 256
  full_timeout: 0.5
  timeout: 1.0
  workers: 64
  banner: true
  # auto = fscan → nmap → 内置 TCP connect；也可钉住 fscan / nmap / builtin
  engine: auto
jsmine:
  enabled: true
  max_pages: 20
  max_js: 40
  secrets: true
  blacklist: []
dirscan:
  # 默认**开启，但只跑浅扫**（mode=quick）：只打精选敏感路径（约 150 条/站），请求量可控。
  # 这是对早期"默认关闭"决策的**有意反转**（用户要求"先浅浅过一遍，再手动决定深度扫"）。
  # 深度扫 = mode 改 deep（或建任务时勾「全目录」/在结果页发起「补扫」）。
  enabled: true
  mode: quick
  # 浅扫单站点上限（dirs_shallow 共约 150 条，基本全吃）
  quick_max_paths: 150
  big_dict: true
  tech_aware: true
  max_paths: 400
  # 深扫专用：对命中的文件名型路径派生 .bak/.zip/.old 等备份变体（额度同 max_paths）
  suffix_aware: true
  # 框架补充扫描额度（dirmap 的 -e 吃不下自定义字典，用它把框架/暴露面字典补上；0 = 关闭）
  fw_max_paths: 150
  # 目录递归（深扫专用，**默认关**）：对目录型命中再往下打一层浅扫精选字典。
  # 三个键必须一起看 —— 单站浅扫约 153 请求，一层递归 = +目录数×(3 基线 + 每目录路径数)。
  recursive_depth: 0        # 层数上限，0 = 关闭
  recursive_max_dirs: 5     # 每站点**所有层合计**最多递归多少个目录
  recursive_max_paths: 40   # 每个递归目录再打多少条浅扫精选字典
vulnscan:
  enabled: true
screenshot:
  # 站点截图（默认关；打开后会调用本机 Edge/Chrome 的无头模式）
  enabled: false
  max_sites: 20
  window: 1280x900
  timeout: 30
  browser: ''
cert:
  # TLS 证书取证（默认关）：对 https / tls_ports 站点做一次 TLS 握手，解析颁发者与有效期到「SSL 证书」页签
  enabled: false
  max_sites: 30
  timeout: 8
  tls_ports: [443, 8443, 9443]
iprecon:
  enabled: false
  api: https://api.webscan.cc/?action=query&ip={ip}
  max_ips: 500
  max_hosts: 200
  max_domains_per_ip: 30
  workers: 5
  timeout: 10.0
fofa:
  enabled: true
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
  cert_enabled: true
  cert_threshold: 200
  max_cert_queries: 10
  title_enabled: true
  title_threshold: 200
  max_title_queries: 10
  # 标题反查的归属相关性过滤：label（默认，标题 token == 域名 label）/ substring（回退，子串）
  title_match: label
ssrf:
  # A10 SSRF 受控回连（默认关）：本机监听 + 每参数唯一 token，收到回连即判"服务端会出网"。
  # 只在目标能回访扫描机时有效（NAT/云主机大概率收不到）；callback_base 留空 = 用本机监听地址
  enabled: false
  callback_base: ''
  host: 127.0.0.1
  port: 0
  wait_seconds: 6.0
  max_params: 12
shodan:
  # Shodan favicon 反查（默认关）：http.favicon.hash:<mmh3>，需 config/keys.yaml 填 shodan.key
  enabled: false
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
quake:
  # 360 Quake favicon 反查（默认关）：favicon: "<mmh3>"，需 config/keys.yaml 填 quake.key
  enabled: false
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
ctlog:
  # 证书透明度（CT）日志在线查询（crt.sh，免 key，默认关）：证书维度记录 + 拓展域名来源
  enabled: false
  max_domains: 10
  max_records: 50
  max_domains_per_cert: 50
  timeout: 25
  write_certs: true
blacklist:
  enabled: true
  path: config/blacklist.txt
intel:
  # 漏洞情报订阅（默认关）：CISA KEV（免 key）拉回来后与本地指纹保守匹配，只产出线索（leads 表）
  enabled: false
  source: kev
  url: ''
  cache_hours: 24
  timeout: 20
  max_leads: 50
heuristic:
  # 启发式候选发现（默认关）：对已收集数据做差分/异常聚合，不发请求，只产出线索（leads 表）
  enabled: false
  max_leads: 50
github:
  # GitHub 泄露检索（默认关）：拿目标注册域去 GitHub 公开代码里搜命中，只产出线索（leads 表）。
  # token 不在本文件：填 config/keys.yaml 的 github.token（GUI 不写回、该文件已 gitignore）。
  # 边界见 scanner/github_leak.py 文件头：只落元数据（不保存文件内容）、auth=False、没 token 零请求。
  enabled: false
  max_domains: 3
  max_queries: 4
  per_page: 30
  max_leads: 30
  timeout: 20
tools:
  subfinder: subfinder
  puredns: puredns
  httpx: httpx
  nmap: nmap
  # fscan（可选）：二进制名或路径；找不到就跳过它（回退 nmap / 内置）。调用时强制 -np -nobr -nopoc。
  # 本机是自编译产物挂目录联接（tools/fscan/ → 仓库外，见 .gitignore）；相对路径按**项目根**解析。
  fscan: tools/fscan/fscan.exe
  dirmap:
    python: python
    script: tools/dirmap/dirmap.py
    threads: 30
dicts:
  subdomains: config/dicts/subdomains.txt
  resolvers: config/dicts/resolvers.txt
  dirs: config/dicts/dirs_small.txt
  # 浅扫精选字典（dirscan.mode=quick 时只用这一份）
  dirs_shallow: config/dicts/dirs_shallow.txt
  dirs_big: config/dicts/dirs_big.txt
  dirs_common: config/dicts/dirs_common.txt
  dirs_jsp: config/dicts/dirs_jsp.txt
  dirs_php: config/dicts/dirs_php.txt
  dirs_asp: config/dicts/dirs_asp.txt
  # 框架字典（tools/import_fw_dicts.py 派生；运行时按 sites.tech 命中的框架排在最前）
  dirs_wordpress: config/dicts/dirs_wordpress.txt
  dirs_phpmyadmin: config/dicts/dirs_phpmyadmin.txt
  dirs_druid: config/dicts/dirs_druid.txt
  dirs_spring: config/dicts/dirs_spring.txt
  dirs_weblogic: config/dicts/dirs_weblogic.txt
  dirs_tomcat: config/dicts/dirs_tomcat.txt
  dirs_jenkins: config/dicts/dirs_jenkins.txt
  dirs_elastic: config/dicts/dirs_elastic.txt
  dirs_swagger: config/dicts/dirs_swagger.txt
  dirs_confluence: config/dicts/dirs_confluence.txt
  dirs_gitlab: config/dicts/dirs_gitlab.txt
  # 通用暴露面（.git/.env/备份文件），排语言字典后、通用字典前
  dirs_exposure: config/dicts/dirs_exposure.txt
  sensitive: config/dicts/sensitive.txt
  cdn_cname: config/dicts/cdn_cname.txt
  # CDN 厂商任播 IP 段（CNAME 链为空时兜底判定，见 scanner/cdn.py）
  cdn_ips: config/dicts/cdn_ips.txt
http:
  user_agent: Mozilla/5.0 (compatible; CTFScanner/0.1; +authorized-testing-only)
