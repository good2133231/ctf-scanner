gui:
  # ⚠ 这一份是**服务器形态**，刻意比代码默认值 `scanner/config.DEFAULTS`（127.0.0.1 + 门关掉）更
  #   保守，**两者不一致是有意的**。看这里的人反复踩同一个坑：`load_settings()` 是拿本文件**盖在**
  #   DEFAULTS 上，而本文件被 git 跟踪 ⇒ 新 clone 拿到的是下面这些值，不是 DEFAULTS 里那对。
  #   两条后果，动这两行之前先想清楚：
  #   · **删掉** `host` / `edge_auth.enabled` 这两行 ＝ 立刻退回 DEFAULTS 的本机形态，
  #     不是"恢复默认"那么无害 —— 正在给别人用的部署会当场失联（绑回 127.0.0.1，外面的人连不上；DEFAULTS 里这道门**也是关的**，不是"退回一道开着却没口令的门"）。
  #   · 保持现状（`enabled: false`，续151/续154）＝ 新 clone 打开就到登录页，门是**关的**：
  #     能连到这个端口的人只剩后台账号这一道门。要开就在策略配置页「控制台」段勾选，或把下面那行
  #     改 true 并**先配好口令** —— 门开着而口令没配才是**全站 401**（fail-closed，有意的）。
  #     没有终端时用环境变量喂同一条命令：
  #     `CTFSCANNER_EDGE_PASSWORD='<口令>' python -m scanner.edgeauth --set`（续146-附2；
  #     启动向导仍绝不代填，三条状态口径与判据见 `scanner/edgeauth.py` 的 docstring ⑤ 与 `[8aw]`）。
  # 续197：页面说明文字（各页灰色小字，class="note"）默认**不显示** —— 主理人点单
  # 「系统设置默认关闭注释，可手动开启注释」。true = 默认显示。
  # 顶栏那颗「显示说明」是 cookie 级本机开关，优先级高于这一项。
  notes: false
  host: 0.0.0.0
  port: 5000
  # 续233（主理人规则）：起动时端口被占 ⇒ 直接结束占用者、占回首选端口（不再顺延换端口）。
  # 护栏见 scanner/portguard.py（绝不杀自己 / PID 1 / 身份不明）；临时关：环境变量
  # CTFSCANNER_GUI_KILL_PORT=0。每次杀进程都会连 PID + 命令行写进启动日志。
  kill_port_on_conflict: true
  # ---- 部署到服务器（续47，见 docs/deploy-https.md）----
  # 三项默认都是最保守值，要用必须显式改；改完需重启控制台才生效。
  # allowed_hosts：Host 白名单的显式扩展（空 = 只认 127.0.0.1/localhost/::1）。
  #   反向代理部署时浏览器发来的 Host 是部署域名，不填这里会整站 403。
  #   只接受明确枚举的域名，写 "*" 之类通配会被忽略（不允许放行一切）。
  # 留空 = Host 头校验整条不生效（`gui/app.py:520`：只在此项非空、或绑的是回环时才开）。
  # 本机是 0.0.0.0 + 空 ⇒ 该校验关闭：任何能路由到 5000 的人都拿得到登录页与 401 输入框，
  # 但过不了 401 边缘口令与后台账号这两道门 —— 这是用户 2026-10-08 的明确取舍
  # （多人一起用的内部系统），不是疏漏，也不再每次启动劝用户改回来。
  # 代价留在原地而不是藏起来：这道校验挡的是 DNS rebinding（恶意域名解析到 127.0.0.1，
  # 骗过浏览器同源判定后带用户登录态打进来）。关掉后这一条只剩 401 兜：浏览器对**新 origin**
  # 不会自动附带已存的 Basic 凭据，但会**弹出**输入框 —— 口令被输进那个来路不明的框就破防了。
  # 想重新拉开这道校验：在这里显式列出实际访问用的主机名（`*` 会被忽略，只接受枚举）。
  allowed_hosts: []          # 用户 2026-10-08 明确关掉这道拦截，靠 401 + 后台账号兜
  # behind_proxy：是否信任反代转发的 X-Forwarded-Proto/Host/For。
  #   默认 false —— 这些是请求头、可被伪造；仅当"应用只被自己的反代访问"时才开 true。
  behind_proxy: false
  # secure_cookie：会话 Cookie 是否加 Secure（只在 HTTPS 下回传）。
  #   默认 false —— 走 HTTP 时开了会直接登录不上；上了 TLS 反代后请改 true。
  secure_cookie: false
  # 扫描运行日志要不要**同时**刷到终端（续156：默认关）。关着的时候终端只留启动横幅与告警，
  # 逐条 INFO 只进 logs/server.log 与每个任务的 task.log；页面上的「任务日志」面板读的是后者。
  # CLI 不看这一项（它的全部界面就是终端）。
  console_logs: false
  # 续157 #D：要不要问第三方 https 接口取"公网出口 IP"（默认开）。关掉＝一个外发请求都不发，
  # 横幅首行只印绑定值。绑回环时本来就不取（本机自用没有"外网地址"这回事）。
  announce_egress_ip: true
  # ---- 401 边缘认证门（scanner/edgeauth.py）：无 Basic 凭据的请求进不到任何路由 ----
  # 这里**只有开关**。口令写在 config/edge_auth.yaml —— 明文、一行 password: <口令>；该文件与
  # config/keys.yaml 同类、在 .gitignore 里。本文件被 git 跟踪而仓库是公开的，口令写进这里就等于
  # 交给全世界，且 git 历史不会忘（事后删行没用）。
  # 也可以用命令写（顺带把权限设成 0600）：python -m scanner.edgeauth --set
  # 用户名固定为 edge，只有口令是秘密。enabled=true 而口令文件缺失**或为空** → 一律 401（fail-closed）。
  # ⚠ 明文 HTTP 下 Basic 会把口令随每个请求带出去；跨不可信链路请上 TLS 反代（docs/deploy-https.md）。
  # 注：AGENTS.md §5.10「不许有绕过账号的登录路」由用户 2026-10-08 明确豁免，见该文件。
  # 续150（用户 2026-10-11 点单"暂时取消401，可以让我在配置里面选择要不要开启"）：**出厂默认改成 false**
  # —— 新 clone 直接打开就能到登录页；要开就把这里改回 true，并先配好口令
  # （`python -m scanner.edgeauth --set` 或 config/edge_auth.yaml）。
  edge_auth:
    enabled: false
  # ---- keys.enc.yaml 的启动解锁询问（续133）----
  # true（代码里的默认值）= 启动时问一次口令；false = 不打扰启动。
  # 需要解锁时：设环境变量 CTFSCANNER_KEYS_PASSPHRASE，或用 python cli/run_keys.py 显式操作。
  # 关掉的只是**提问**，不是加密：有密文而没解锁时仍会打一行 [!] 凭据保持锁定 —— 因为
  # "有密文但没解"与"没配 key"在日志里长得一模一样，静默掉会让人误判（AGENTS.md §7 续114）。
  # 这一项页面上改不了，只能手改本文件 —— 先例是下面的 login_lockout / audit。
  keys_ask_passphrase: false
  # ---- 后台路径随机化（续138，scanner/webpath.py）----
  # true（默认）= 每次启动把整个控制台挂到**新生成**的两段随机路径下（两层各 10 位、共 20 位），
  # 根路径与任何错误路径一律 404 且响应体为空 —— 扫端口、爬根目录的人找不到入口。
  # ⚠ 它**不是访问控制**：拿到那条 URL 的人照样到得了登录页。真门槛仍是上面那道 401 边缘门
  #   加 `users` 表账号 —— 别把它当成"别人进不来"。
  # 地址只在启动那几行里打印，**不写进任何文件**（本文件被 git 跟踪、仓库是公开的）。重启即换；
  # 想固定就设环境变量 CTFSCANNER_WEB_PATH=/某个路径（空串＝挂回根路径）。
  # 页面上改不了这一项，只能手改本文件 —— 先例是上面的 keys_ask_passphrase。
  web_path_random: true
  # ---- 登录限速 / 失败锁定（续48，见 scanner/login_guard.py）----
  # 保护性开关默认开，阈值刻意宽松（本机/小队共用：一次记错口令不该把队友挡在门外）。
  # 两级判据：按 IP 为主、按用户名兜底；被锁时返回 429 + Retry-After，文案与"账号是否存在"无关。
  # 自救：等 lockout_seconds 过期，或命令行清除（见 docs/deploy-https.md §7）。
  login_lockout:
    enabled: true
    window_seconds: 300      # 失败计数时间窗（秒）
    max_fails_per_ip: 5      # 同一 IP 在窗口内的失败上限（续108：10 → 5，控制台可能被绑到公网）
    max_fails_per_user: 20   # 同一用户名在窗口内的失败上限（兜底，更宽松）
    lockout_seconds: 900     # 触发后的锁定时长（秒）
  # ---- 访问审计流水（续48，见 scanner/audit.py）----
  # 记录"谁/何时/从哪个 IP/做了什么/成败"，**只记元数据、绝不记口令与凭据**；
  # 管理员可在「访问审计」页查看，超过 retention_days 的行在启动时被清理（只清 audit_log）。
  audit:
    enabled: true
    retention_days: 30
# ---- 持久化任务队列（续49，见 scanner/queue.py）----
# 任务不再由控制台直接起线程，而是**入队**由 worker 消费 —— 进程重启后任务不丢
# （死掉的 running 会被启动对账**重新入队**，见 db.reconcile_orphan_tasks）。
# workers：并发消费者数。默认 1 = 串行 —— 最省目标侧带宽、最不容易触发风控/封禁；
#   只有部署到服务器、确有多任务并行需求时才调大（上限 8）。
queue:
  # 续201（主理人点单"多任务执行现在还是实现不了吗，我看还是排队"）：1 → 2。
  # 代价说清：两个任务同时打同一个目标侧，请求量翻倍、更容易触发风控/封禁；
  # 只图最省带宽与最不容易被封就改回 1。想按机器规格自动收：勾 workers_auto（小 1 / 中 2 / 大 4）。
  workers: 3
  # 续184：true ＝ 再按本机规格收一道（小 1 / 中 2 / 大 4）；false ＝ 只认 workers
  workers_auto: false
# ---- 开发模式 / 全流程自检（续50，见 scanner/devmode.py）----
# 打开后各阶段的"量"（并发/在飞/速率/每阶段配额）被**运行时压到最小（1）**，
# 目的是先验证流程本身能不能跑通，不被"量"的问题干扰；压量只作用于**本次运行的内存副本**，
# **绝不写回本文件**（关掉 enabled 即恢复原策略）。默认关；自检入口见 cli/run_devflow.py。
dev:
  enabled: false
  fixture_port: 0        # 内置靶场端口，0 = 系统自动分配（避免与已占用端口冲突）
limits:
  max_workers: 20
  # 动态并发档（续179，参照 recon-spiral"按产出加码"）：fixed = 整批开满 max_workers（现状）；
  # ramp = 从 workers_floor 起步、每批有产出就翻倍封顶（零产出的批不升档）——小任务不再
  # 一上来就开满线程。基准实测数字见 CHANGELOG 续179。
  workers_mode: fixed
  workers_floor: 4
  # 按机器规格收并发上限（续181，借鉴点⑤）：false＝只认 max_workers（现状）；
  # true＝min(max_workers, machine_tier 建议值)（小 ≤2C/4G→8、中 ≤4C/8G→16、其余→32）。
  workers_auto: false
  # 续215-P2-12：true ＝ 再按**上一轮真任务实测**收一道（CPU 占比 / 峰值内存）；
  # 与 workers_auto 独立，且只会往下收。无画像（首跑/老库）时不动。
  workers_profile: true
  http_timeout: 10
  verify_tls: false
  # 第三方接口（FOFA/Shodan/Quake/crt.sh/KEV/iprecon/api.github.com）的证书校验，**默认开**。
  # 与上面那项分开：verify_tls 只为**目标侧**自签名靶场降级；第三方是公网 CA 签名、还带
  # API key / PAT，跟着降级等于把凭据交给中间人。企业 MITM 代理下 certifi 认不出根证书时
  # 才需要关掉它（属显式降级）。
  verify_tls_external: true
  dirscan_max_urls: 20
  vulnscan_max_urls: 100
  brute_max_domains: 50
  # 字典爆破的词数闸门（续139，喂进深档之后必须有）：`brute_max_words` 管 puredns 那一路的
  # **深档**上限、`brute_fallback_max` 管内置那一路的深档上限（内置是系统解析器逐条查，所以单独
  # 更紧）；**两道都只冲深档 —— 精简档 84 条任何情况下全量在场**。超出即等距抽样（取前 N 条会把
  # 排好序的字典开头那串 `0/00/000/aa` 全收进来、把 api/admin 全挤掉）；0 = 全量。
  # 想吃下深档全量请装 puredns：python cli/client.py --update-tools --tool puredns。
  brute_max_words: 0
  # 内置 DNS 爆破的并发（纯 DNS 等待，和上面 max_workers 的 HTTP 并发刻意分开）：
  # 实测 3000 条 @20 线程 ≈ 53 秒；闸门设 0 吃全量 17.8 万条时 128 线程跑了 45 分钟还没跑完
  brute_workers: 64
  # 组合爆破（把精简档词与已发现名字的首段两两拼成 `a-b`）每域名的词数上限；0=关。
  # 与灯塔逐条比实时，它独有域名里有 10 个**任何字典都没有**（`api-contract`/`ws-spot`/`admin-oss`），
  # 只能拼出来 —— 灯塔的 ALT_DNS_CONCURRENT 干的就是这件事。
  brute_combo_max: 4000
  brute_fallback_max: 3000
  # 字典**条数合计**低于这个值就喊一声（精简档 84 + 深档）。不喊，用户会把"子域名比灯塔少"读成
  # "收集器不行"，而真正差的是字典。深档见 dicts.subdomains_deep（仓库发的是 17.8 万条那份）。
  # 再补更深的一样一条命令：python tools/import_subdomain_dict.py --src <你那份深字典>
  brute_dict_warn_min: 1000
  # 二层遍历每轮最多补探多少主机（攒够就停止 DNS 预筛，见 probe.second_pass）
  recrawl_max_hosts: 300
  wildcard_filter: true
  favicon_md5: true
  # 统一并发/限速/全局预算门控（F2）。默认路径永不触发拒绝：256 恰等于现有单任务最大并发，
  # 单任务行为不变，只把跨任务的 N×2048 夹到 256。rate/budget 默认 0 = 不启用（opt-in）。
  max_inflight_global: 256       # 进程级在飞上限（跨任务共享）；0=不限
  max_inflight_per_task: 256     # 单任务在飞上限；0=不限
  rate_per_sec: 0                # 令牌桶速率（次/秒）；0=不限速
  rate_burst: 0                  # 令牌桶突发容量；0 → 取 max(rate_per_sec, 1)
  budget_total: 0                # 单任务请求总预算（HTTP/裸 socket/子进程共用）；0=不设预算
  budget_subprocess_weight: 1
  # 外部引擎自管流量的预估与硬上限（续128）：0 = 不限（默认）。预估无论设不设都会打进日志。
  # 单位不同故分两项：afrog 是 HTTP 请求数，fscan/nmap 是端口探测次数。
  external_max_requests: 0
  external_max_port_probes: 0    # 每次外部工具调用消耗的预算单位
checks:
  min_severity: high
  skip_severities:
  - info
  - low
  poc_engine: true
  disabled_categories: []
  disabled_checks: []
  poc_link_tags: true
  poc_max_per_site: 80
  # 续151 无依赖 ML：POC 按学习到的命中概率排序（需 data/ml/poc_model.json；默认关）
  poc_priority: false
subdomain:
  # 子域名资产的 IP/CNAME 回填与 CDN 标记（纯 DNS 只读查询，不发 HTTP）
  max_resolve: 500
  dns_timeout: 3
  # subfinder(-all) 与内置免 key 被动源取并集，做到"尽量全"
  union_passive: true
  # 目标是 URL 或子域时，自动把注册域也当成子域名收集的根（续145，用户点单）
  auto_root: true
  # 续160：沿用历史子域名。上游源（subfinder 的多来源、被动源、C 段反查）每次返回的集合
  # 并不稳定，只看本轮新发现会让同一目标的资产面忽大忽小；库里别的任务已经发现过、且归属
  # 本次目标的自家域名，这次没被重新发现也该继续参与探测。0 = 不限（不建议）。
  reuse_history: true
  reuse_history_max: 300
  # 续169：拓展域名的「自动递归」两档默认。**默认组合＝不扩** —— 层数 1 时 runner 直接早退，
  # 阈值一个字都不参与；要扩就把层数调到 2..10（每层上限 10 层，写更大也夹到 10）。
  # 阈值 `high` 的含义：拓展域名与「已确认资产」（本任务自家子域 + 目标注册域那一层）的
  # 主标签差 ≤2 步且相似度 ≥0.70 才跟着进下一层，例如目标 `abcd.org` 拓展出 `abdc.com`。
  # 判据只有一份（`scanner/extdom.py::confidence()`），页面上的徽章读的也是它。
  # 第三方清单 / CDN / 黑名单命中的名字**无论多像都不自动扫**。
  ext_depth: 1
  ext_min_confidence: high
  # 续263：主域名不同但置信度达阈值的拓展域名 → 自动建子任务送探（取代人工点「送去探测」）。
  # 三道闸与阈值照旧；送过的域名不重复送；一次最多 ext_auto_probe_max 个，超出的只在日志报条数。
  ext_auto_probe: true
  ext_auto_probe_max: 5

passive:
  enabled: true
  sources: []
  timeout: 20
evasion:
  random_ua: true
  spoof_xff: false
  waf_bypass: true
  bypass_level: 2
  waf_detect: true
takeover:
  enabled: true
  max_hosts: 300
  http_check: true
portscan:
  enabled: false
  max_hosts: 100
  ports: '80,81,443,3000,5000,5001,7001,7002,8000,8001,8002,8008,8080,8081,8082,8088,8443,8888,9000,9090,9443'   # 续250：常见 web 端口（空串=内置 TOP 48）
  mode: top                  # 续250 起：默认只打常见 web 端口（主理人点单）；full＝1-65535 走单任务触发
  full_ports: 1-65535
  exclude_scanned: true
  full_workers: 256
  full_timeout: 0.5
  timeout: 1.0
  workers: 64
  banner: true
  # auto = fscan → nmap → 内置 TCP connect；也可钉住 fscan / nmap / builtin
  engine: auto
  # 续151 无依赖 ML：banner 字符 n-gram 朴素贝叶斯补服务识别（需 data/ml/service_model.json；默认关）
  ml_service: false
icp:
  enabled: false              # 续205：备案反查（同主体域名）。默认关 —— 只读查询，但要按次烧配额
  preflight: true             # 开跑前每个源先探一次，不通的整轮跳过并说清（不白跑）
  max_domains: 50             # 最多查多少个域名
  probe_domain: example.com   # 预检用的探活域名
  # api_key 只进 config/keys.enc.yaml（不落明文）；源需要 key 时按该项的 key_header 带上
  api_key: ''
  # 源清单：加一个**可达的**源就是往这里加一行，不改代码。
  #   {{domain}} 会被替换成要查的域名；key_header 非空时把 api_key 按那个头名带上。
  # 预置的工信部官方源**在国内托管** ⇒ 海外出口通常不可达（本机实测 http=000）；
  # 换机器/加代理后它即可用，或换成海外托管的镜像/付费 API（如阿里云市场 APPCODE 型）。
  sources:
    - name: miit
      url: https://hlwicpfwc.miit.gov.cn/icpproject_query/api/icpAbbreviateInfo/queryByCondition
      key_header: token
# 指纹识别（续221）：单站标签上限，超出截断并明示（见 fingerprint.flush）
fingerprint:
  max_tags: 10

hostcollide:
  # 续203：默认**开**（主理人点单）。只读 GET、请求量由 max_requests 夹住；
  # 命中按 collide:<ip> 前缀落库 ⇒ 自动归 own 口径。
  enabled: true
  max_requests: 200           # 单任务请求预算（只读 GET）
  timeout: 5
crawl:
  enabled: true               # 续249 起默认开（主理人点单）；额度上限见下，要关：策略页取消勾选
  max_sites: 30               # 每任务最多爬多少个站点
  max_links: 60               # 每站点最多收多少条
  max_pages: 8                # 每站点最多抓几页（含首页）
  max_depth: 1                # 最多再跟几层（0＝只解析站点首页）
  same_site: true             # 只收同 host 的链接；外链（社交按钮/CDN 直链）不收
  include_subdomains: false
  timeout: 10
  workers: 8
  feed_vulnscan: true         # 带参链接（注入面）喂给漏洞检测
  max_feed: 10                # 每站最多喂几条（0＝不喂）
  max_feed_total: 40          # 全任务总闸（vulnscan 侧再夹一道）
jsmine:
  enabled: true
  max_pages: 20
  max_js: 40
  secrets: true
  blacklist: []
  recrawl: true          # 二层遍历：jsmine 挖出的新域名（含库里其余未探过的本任务域名）补探成站点
  # ---- 续171（2026-10-13 用户点单）：拓展域名"宁缺毋滥"三道闸（只对非自有域名动手）----
  # ① 解析门：明确 nxdomain 的第三方候选不入库（DNS 无结论照常放行 —— 可能会漏但不会错）；
  # ② CDN 门：解析命中 CDN 厂商（CNAME/IP 段，如 at.alicdn.com）→ 别人的基础设施，不入库；
  # ③ 停车门：首页是"域名转让 / DNS resolution error"或两端口均无响应（如 style.font.name）→ 不入库。
  # 每一档拒绝的数量与样本都写进任务日志；关闭 verify_resolve = 三道闸整条停用。
  verify_resolve: true
  drop_cdn: true
  parking_check: true
  parking_check_max: 100   # 停车检测的首页 GET 预算（超出的候选直接放行并在日志报数）
  strip_comments: true     # 域名抽取前剥离 JS 注释（license banner 里的 OSS 主页是噪声大头）
dirscan:
  # 默认**开启且默认深扫**（mode=deep，续144 起：全量分层字典 + dirmap + 后缀派生 +
  #   历史URL/robots/sitemap 自曝入口 —— 后两路只在深扫并入）。
  # ⚠ 这段注释在 10-08 写过"只跑浅扫（quick）"，10-09 翻 deep 时忘了同步，说了 12 天假话
  #   （续252 修）：**以 mode 行为准**，别信注释里的档位描述。
  # 浅扫 = mode 改 quick（或建任务不勾「全目录」）：只打精选敏感路径（约 150 条/站）。
  # 请求量口径（每站点）：quick ≈ 150 + 软404 基线 3；deep ≈ 400 + 基线 3 + 后缀派生（≤400）
  #   + 递归（默认关，开则 +5×(3+40)=215）。与"全端口 6.5 万连接/主机"差两个数量级。
  enabled: true
  mode: deep                  # 续144：默认深扫（全量分层字典 + dirmap + 后缀派生）
  # 浅扫单站点上限（dirs_shallow 共约 150 条，基本全吃）
  quick_max_paths: 150
  big_dict: true
  tech_aware: true
  # 续248：历史 URL（wayback CDX + OTX url_list，零目标流量）并入目录候选路径。
  # 关掉：history_enabled=false；单注册域条数上限：history_max；带查询串：history_with_query
  history_enabled: true
  history_max: 1000
  history_with_query: false
  # 续250：站点自曝入口（robots.txt Disallow + sitemap.xml 含索引一层）并入目录候选。
  # 关掉：selfurls_enabled=false；单站条数上限：selfurls_max
  selfurls_enabled: true
  selfurls_max: 500
  # 续222：外部字典源（零入仓）。path 指向本机字典目录（相对仓库根或绝对路径），
  # 该目录下每个 .txt 的分类名就是一层；picks 只接列出的分类（空＝全接）；
  # after 指定插在哪一层之后（fw/lang/shallow/exposure/common，缺省 common）。
  # **只在深扫档生效**：快扫（150 条精选）与框架补充扫描（fw+exposure）不吃外部字典。
  # 例：把 dirsearch 的 api/backup 两类接在暴露面之后
  # dict_sources:
  #   - name: dirsearch
  #     path: tools/dirsearch/dicts
  #     picks: [api, backup]
  #     after: exposure
  dict_sources: []
  max_paths: 400
  # 深扫专用：对命中的文件名型路径派生 .bak/.zip/.old 等备份变体（额度同 max_paths）
  suffix_aware: true
  # 框架补充扫描额度（dirmap 的 -e 吃不下自定义字典，用它把框架/暴露面字典补上；0 = 关闭）
  fw_max_paths: 150
  # 目录递归（深扫专用，**默认关**）：对目录型命中再往下打一层浅扫精选字典。
  # 三个键必须一起看 —— 单站浅扫约 153 请求，一层递归 = +目录数×(3 基线 + 每目录路径数)。
  recursive_depth: 1        # 续144：默认往下一层；层数上限，0 = 关闭
  recursive_max_dirs: 5     # 每站点**所有层合计**最多递归多少个目录
  recursive_max_paths: 40   # 每个递归目录再打多少条浅扫精选字典
  # 续151 无依赖 ML：软 404 模板页用 n-gram Jaccard 兜底（md5/长度对不上时）；默认开
  ml_template: true
  # 续151 无依赖 ML：把长度离群的 200 命中点名到日志（只提示、不改入库）；默认开
  ml_outlier: true
vulnscan:
  enabled: true
afrog:
  # 外部引擎 afrog（续149 **默认开**）：让 config/afrog-pocs/ 里的"只读 + info 级" PoC 跑一轮。
  # 三条闸门缺一不可（开关 / 目录里有只读模板 / 本机装了二进制），缺了只写一行日志、零请求。
  # 它自管请求、绕过本任务预算 ⇒ 下面几个限速值是**保守值**，scanner/afrog.py 还会再封顶。
  enabled: true
  poc_dir: config/afrog-pocs   # 相对路径按项目根解析；框架不代为下载 PoC（放你自己的模板进去）
  max_targets: 20              # 一次最多交多少个站点（封顶 200）
  timeout: 8                   # 单请求超时（秒，封顶 30）
  concurrency: 4               # 它的 -c（封顶 25）
  rate: 10                     # 全局 -rl 请求/秒（它默认 150！封顶 50）
  per_target_rate: 5           # 单目标 -rlt（封顶 25）
  proc_timeout: 600            # 整进程超时（秒，封顶 1800）
screenshot:
  # 站点截图（默认关；打开后会调用本机 Edge/Chrome 的无头模式）
  enabled: false
  max_sites: 20
  window: 1280x900
  timeout: 30
  # 续225：一次性截图给页面留的"跑完首屏 JS"时间（--virtual-time-budget，毫秒；0＝关）。
  settle_ms: 3000
  # 续225：jsmine 后再截一次核对 md5；不一致就多截一张，取出现两次的那张（多数表决）。
  verify_after_js: true
  # 续161「候补重试」：任务跑完后把「超时 / 跳转未落地 / 连不上」三档没截成的站点排进队列
  # 再试一轮（只跑 screenshot 阶段、只打这批 URL，等前面的任务跑完、worker 空了才执行）。
  # 续164 起随包**打开成 1**（主理人点单「有些站点截图超时，建议加入候补运行，在项目没完成前
  # 空闲再重试一下」）。代码 DEFAULTS 仍是 0＝关 —— 开在这一层，不偷改出厂代码（[8bq] 的口径）。
  # 填 0 就退回"一个字都不排"；上限 2 轮（夹在 screenshot.RETRYABLE_MAX_ROUNDS，配多了也没用）。
  retry_rounds: 1
  # 续170：一次性截图失败后改走 **CDP 兜底**（挡掉埋点/统计域、不等 load 直接要图）。
  # 为什么不是"再打一次同一条 URL"：实测那类页面永不 load，同一条路再走一遍必然还是超时
  # （一份真实任务日志里 6 个超时站点白等 30+60 秒、0 张救回）。
  # 关掉 `cdp_fallback` 就退回"只有一次性 + 候补轮"。数值含义见 scanner/config.py 的注释。
  cdp_fallback: true
  cdp_wait: 45
  fallback_wait: 10
  block_extra: []
  browser: ''
  # 续175：中文字体（可选）。留空＝不注入；填了才给无头浏览器设 FONTCONFIG_FILE。
  # 典型：把字体放进 tools/fonts/，再指向 tools/fonts/fonts.conf。
  fontconfig: ''
cert:
  # TLS 证书取证（默认关）：对 https / tls_ports 站点做一次 TLS 握手，解析颁发者与有效期到「SSL 证书」页签
  enabled: false
  max_sites: 30
  timeout: 8
  tls_ports: [443, 8443, 9443]
iprecon:
  # 续150（用户 2026-10-11 点单"真实 ip 反查域名功能"）：默认打开。免 key（api.webscan.cc），
  # 把已知 IP（目标 IP + 站点解析 IP + 子域名 A 记录）反查成域名：命中的域名进拓展域名页，
  # 属于本项目注册域的会在「自动拓展扫描」时追加成正常子域。需能出网；出不去只写一行日志。
  enabled: true
  api: https://api.webscan.cc/?action=query&ip={ip}
  max_ips: 500
  max_hosts: 200
  max_domains_per_ip: 30
  workers: 5
  # 续184：开跑前先探活（挂了就整轮跳过，不再每个 IP 各打一条 DEBUG）；
  # 默认源全挂时换备用池，备用池第一个 ptr 是本框架自己实现的原生 PTR（不发 HTTP）
  preflight: true
  fallback_sources: [ptr, dnsdblookup, rapiddns, viewdns]
  api_rapiddns: https://rapiddns.io/s/{ip}?full=1
  api_viewdns: https://viewdns.info/reverseip/?host={ip}&t=1

# FOFA 反查（默认关）：favicon(icon_hash) / cert="domain" / title 三种。需 config/keys.yaml 填 fofa.key。
# 2026-09-26 用户决定**先关，投入生产时再开** —— 本机开发期少一个出网依赖，也避免误触额度。
extquota:
  enabled: true               # 续211-P1-4：外部引擎配额预检（FOFA/Shodan/Quake 开跑前查余额）
  min_left: 1                 # 剩余次数低于此值 ⇒ 本轮跳过该源并点名
fofa:
  # 续150（用户 2026-10-11 点单"fofa功能也可以启用了 方便我们核查"）：默认打开。
  # 没配 key（config/keys*.yaml 的 fofa.email + fofa.key）时**一次请求都不发**，只写一行日志，
  # 所以打开它是安全的 —— 配了 key 就会在 osint 阶段做 favicon/证书/标题三路反查。
  enabled: true
  max_sites: 30
  max_assets: 100
  workers: 5
  # 续229：两次 fofa 请求的最小间隔（秒）—— 循环反查不节流会撞 HTTP 429（按 key 计频率）。
  # 429 = "你发太快"；调大这个值即可。填 0 = 不节流。
  min_interval: 3
  # 续243：FOFA 也参与**子域名**收集（domain="<注册域>" 反查，source=osint:fofa）。
  # 关掉：false；单域条数上限（FOFA 单次上限 10000）：
  subdomain_enabled: true
  subdomain_max: 100
  black_ico_threshold: 200
  cert_enabled: true
  cert_threshold: 200
  max_cert_queries: 10
  title_enabled: true
  title_threshold: 200
  max_title_queries: 10
  # 标题反查的归属相关性过滤：label（默认，标题 token == 域名 label）/ substring（回退，子串）
  title_match: label
ssrf:
  # A10 SSRF 受控回连（默认关）：本机监听 + 每参数唯一 token，收到回连即判"服务端会出网"。
  # 只在目标能回访扫描机时有效（NAT/云主机大概率收不到）；callback_base 留空 = 用本机监听地址
  enabled: false
  callback_base: ''
  host: 127.0.0.1
  port: 0
  wait_seconds: 6.0
  max_params: 12
shodan:
  # Shodan favicon 反查（默认关）：http.favicon.hash:<mmh3>，需 config/keys.yaml 填 shodan.key
  enabled: false
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
quake:
  # 360 Quake favicon 反查（默认关）：favicon: "<mmh3>"，需 config/keys.yaml 填 quake.key
  enabled: false
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
virustotal:
  # VirusTotal 子域名反查（默认开，2026-10-21 主理人点单）：GET /v3/domains/<注册域>/subdomains，需 config/keys.yaml（或加密的 config/keys.enc.yaml）填 virustotal.key
  enabled: true
  max_domains: 20
  limit: 40
  min_interval: 15.0
ctlog:
  # 证书透明度（CT）日志在线查询（crt.sh，免 key，默认关）：证书维度记录 + 拓展域名来源
  enabled: true
  max_domains: 10
  max_records: 50
  max_domains_per_cert: 50
  timeout: 25
  write_certs: true
blacklist:
  enabled: true
  path: config/blacklist.txt
intel:
  # 漏洞情报订阅（默认关）：CISA KEV（免 key）拉回来后与本地指纹保守匹配，只产出线索（leads 表）
  enabled: true
  source: kev
  url: ''
  cache_hours: 24
  timeout: 20
  max_leads: 50
heuristic:
  # 启发式候选发现（默认关）：对已收集数据做差分/异常聚合，不发请求，只产出线索（leads 表）
  enabled: true
  max_leads: 50
github:
  # GitHub 泄露检索（默认关）：拿目标注册域去 GitHub 公开代码里搜命中，只产出线索（leads 表）。
  # token 不在本文件：填 config/keys.yaml 的 github.token（GUI 不写回、该文件已 gitignore）。
  # 边界见 scanner/github_leak.py 文件头：只落元数据（不保存文件内容）、auth=False、没 token 零请求。
  enabled: true
  max_domains: 3
  max_queries: 4
  per_page: 30
  max_leads: 30
  timeout: 20
  # 续151：弱相关降级（仓库/路径都不含域名或主标签时降为 info，只标不丢）与相关性白名单
  weak_downgrade: true
  relevance_whitelist: []
multileak:
  # 多平台公开代码检索（默认关）：GitHub 之外的只读检索源（默认 grepapp 免 key；gitlab 需 keys.gitlab.token），只产出线索（leads 表）。
  # 边界见 scanner/multileak.py 文件头：只落元数据（不保存文件内容）、auth=False、请求头不带任务登录态。
  enabled: true
  provider: grepapp
  max_domains: 3
  max_queries: 4
  per_page: 10
  max_leads: 30
  timeout: 20
  # 续157 #11：弱相关降级（默认开）与相关性白名单（与上面 github 段同口径）
  weak_downgrade: true
  relevance_whitelist: []
  # 续158 H：provider=gitlab 时的实例根（自建实例改这里）；PAT 写 config/keys.yaml 的 gitlab.token
  gitlab_base: https://gitlab.com
flags:
  # 敏感信息 / CTF flag 候选抽取（续148 由"flag 候选"改名）：只吃**已经拿到**的响应正文，
  # 零额外请求；结果单独进 flags 表（不写 vulns、不计入漏洞数）。判据与成本封顶见
  # scanner/flagfind.py 文件头；内置形状表在 scanner/jsmine.py::SECRET_RULES（唯一产地）。
  enabled: true
  secrets: true        # 关掉就只按下面的 prefixes/patterns 抽
  prefixes:
    - flag
    - ctf
  patterns: []
  min_len: 1
  max_len: 200
  max_chars: 2000000
  max_per_source: 20
  max_per_task: 200
tools:
  subfinder: tools/scanner/subfinder
  puredns: tools/scanner/puredns
  httpx: tools/scanner/httpx
  # afrog（续149）：外部引擎，**默认开**；装好后路径写回这里（相对路径按项目根解析）。
  # 仓库自带一份 Linux 二进制；别的机器在「外部工具」页一键下载，或 `--update-tools --tool afrog`。
  afrog: tools/scanner/afrog
  nmap: nmap
  # fscan（可选）：二进制名或路径；找不到就跳过它（回退 nmap / 内置）。调用时强制 -np -nobr -nopoc。
  # 本机是自编译产物挂目录联接（tools/fscan/ → 仓库外，见 .gitignore）；相对路径按**项目根**解析。
  fscan: tools/fscan/fscan.exe
  dirmap:
    python: python
    script: tools/dirmap/dirmap.py
    threads: 30
  # massdns（续165）：puredns 的 bruteforce/resolve 会在**进程内 exec 它**（靠 PATH 找），
  # 缺它 puredns 每个域名都退码 1。官方只发 C 源码，无带校验和的单二进制，故不进一键下载：
  # 编译：python tools/build_massdns.py --wire（产物落 tools/scanner/massdns，需 gcc/make）。
  massdns: tools/scanner/massdns
dicts:
  subdomains: config/dicts/subdomains.txt
  # 深档子域名字典（续139）：`python tools/import_subdomain_dict.py --src <你那份深字典>` 生成。
  # 文件不存在＝没配，只用上面那份精简档（日志会指路）。精简档永远全量打底，深档才受抽样闸门。
  subdomains_deep: config/dicts/subdomains_deep.txt
  # 续242：12,124 条验证过的公共 resolver（trickest/resolvers 全量 + 国内头部置顶：
  # 223.5.5.5/119.29.29.29/114.114.114.114 …）。puredns 高并发靠它分摊——只有十几条时
  # 必被公共 DNS 限流（慢+漏报）。更新：curl -sL https://raw.githubusercontent.com/trickest/resolvers/main/resolvers.txt
  # 然后与国内头部合并去重（保留 223.5.5.5 等，只收 IPv4）。
  resolvers: config/dicts/resolvers.txt
  dirs: config/dicts/dirs_small.txt
  # 浅扫精选字典（dirscan.mode=quick 时只用这一份）
  dirs_shallow: config/dicts/dirs_shallow.txt
  dirs_big: config/dicts/dirs_big.txt
  dirs_common: config/dicts/dirs_common.txt
  dirs_jsp: config/dicts/dirs_jsp.txt
