gui:
  host: 127.0.0.1
  port: 5000
  token: ctfscanner
limits:
  max_workers: 20
  http_timeout: 10
  verify_tls: false
  dirscan_max_urls: 20
  vulnscan_max_urls: 100
  brute_max_domains: 50
  wildcard_filter: true
  favicon_md5: true
checks:
  min_severity: medium
  skip_severities:
  - info
  - low
  poc_engine: true
  disabled_categories: []
  disabled_checks: []
  poc_link_tags: true
  poc_max_per_site: 80
subdomain:
  # 子域名资产的 IP/CNAME 回填与 CDN 标记（纯 DNS 只读查询，不发 HTTP）
  max_resolve: 500
  dns_timeout: 3
passive:
  enabled: true
  sources: []
  timeout: 20
evasion:
  random_ua: true
  spoof_xff: false
  waf_bypass: true
  bypass_level: 2
  waf_detect: true
takeover:
  enabled: true
  max_hosts: 300
  http_check: true
portscan:
  enabled: false
  max_hosts: 100
  ports: ''
  mode: top
  full_ports: 1-65535
  exclude_scanned: true
  timeout: 1.0
  workers: 64
  banner: true
jsmine:
  enabled: true
  max_pages: 20
  max_js: 40
  secrets: true
  blacklist: []
dirscan:
  # 默认关闭：目录爆破请求量最大、噪声最多，需要时到「策略配置 → 资产面拓展」打开
  enabled: false
  big_dict: true
  max_paths: 400
vulnscan:
  enabled: true
iprecon:
  enabled: false
  api: https://api.webscan.cc/?action=query&ip={ip}
  max_ips: 500
  max_hosts: 200
  max_domains_per_ip: 30
  workers: 5
  timeout: 10.0
fofa:
  enabled: true
  max_sites: 30
  max_assets: 100
  workers: 5
  black_ico_threshold: 200
  cert_enabled: true
  cert_threshold: 200
  max_cert_queries: 10
  title_enabled: true
  title_threshold: 200
  max_title_queries: 10
blacklist:
  enabled: true
  path: config/blacklist.txt
tools:
  subfinder: subfinder
  puredns: puredns
  httpx: httpx
  dirmap:
    python: python
    script: tools/dirmap/dirmap.py
    threads: 30
dicts:
  subdomains: config/dicts/subdomains.txt
  resolvers: config/dicts/resolvers.txt
  dirs: config/dicts/dirs_small.txt
  dirs_big: config/dicts/dirs_big.txt
  sensitive: config/dicts/sensitive.txt
  cdn_cname: config/dicts/cdn_cname.txt
http:
  user_agent: Mozilla/5.0 (compatible; CTFScanner/0.1; +authorized-testing-only)
